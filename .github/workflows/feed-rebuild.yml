name: Refresh feed

on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Fetch feeds
        run: bun scripts/fetch-feed.ts

      - name: Commit if changed
        run: |
          git diff --quiet data/feed/items.json && echo "No changes" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed/items.json
          git commit -m "feed: refresh $(date -u +%Y-%m-%dT%H:%M)"
          git push
