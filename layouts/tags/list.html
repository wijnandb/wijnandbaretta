{{ define "main" }}
<header class="page-header">
  <h1>Tags</h1>
  <p>Browse all content by topic</p>
</header>

<div class="tags-cloud">
  {{ range .Data.Terms.Alphabetical }}
  <a href="{{ .Page.RelPermalink }}" class="tag-item" style="font-size: {{ add 0.8 (mul .Count 0.05) }}rem">
    {{ .Page.Title }}
    <span class="tag-count">{{ .Count }}</span>
  </a>
  {{ end }}
</div>

<style>
.tags-cloud {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  align-items: center;
}

.tag-item {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 1rem;
  background: var(--code-bg);
  border-radius: 20px;
  text-decoration: none;
  color: inherit;
  transition: all 0.2s;
}

.tag-item:hover {
  background: var(--primary);
  color: var(--theme);
}

.tag-count {
  font-size: 0.75em;
  padding: 0.1rem 0.4rem;
  background: var(--border);
  border-radius: 10px;
}

.tag-item:hover .tag-count {
  background: rgba(255,255,255,0.2);
}
</style>
{{ end }}
