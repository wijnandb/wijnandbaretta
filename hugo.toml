baseURL = "https://www.wijnandbaretta.com/"
languageCode = "en"
title = "Wijnand Baretta"
theme = "PaperMod"
enableEmoji = true
enableRobotsTXT = true
enableGitInfo = false

[pagination]
pagerSize = 10

[params]
author = "Wijnand Baretta"
description = "Builder, educator, AI-augmented human. Exploring how technology can help us live better."
keywords = ["AI", "entrepreneurship", "education", "ADHD", "startups", "building in public"]
images = ["/images/og-default.png"]
env = "production"

  [params.schema]
  publisherType = "Person"
dateFormat = "January 2, 2006"
defaultTheme = "auto"
ShowReadingTime = true
ShowShareButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = false
ShowRssButtonInSectionTermList = true
UseHugoToc = true

  [params.editPost]
  URL = "https://github.com/wijnandb/wijnandbaretta/edit/main/content"
  Text = "Edit on GitHub"
  appendFilePath = true
disableSpecialCharacterCaption = false
disableScrollToTop = false
comments = false
hideMeta = false
hideSummary = false
showtoc = true
tocopen = false

  [params.homeInfoParams]
  Title = "Hi, I'm Wijnand"
  Content = "Builder, educator, AI-augmented human. I believe the world is editable - and I'm here to help edit it."

  [[params.socialIcons]]
  name = "github"
  url = "https://github.com/wijnandb/"

  [[params.socialIcons]]
  name = "linkedin"
  url = "https://www.linkedin.com/in/wijnandbaretta/"

  [[params.socialIcons]]
  name = "x"
  url = "https://x.com/wijnandb/"

  [params.profileMode]
  enabled = false
  title = "Wijnand Baretta"
  subtitle = "Builder | Educator | AI-augmented human"
  imageUrl = "images/profile.jpg"
  imageWidth = 120
  imageHeight = 120

  [params.assets]
  favicon = "/favicon.svg"
  favicon16x16 = "/favicon.svg"
  favicon32x32 = "/favicon.svg"
  apple_touch_icon = "/favicon.svg"

  [params.cover]
  hidden = false
  hiddenInList = false
  hiddenInSingle = false

  [params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  location = 0
  distance = 1000
  threshold = 0.4
  minMatchCharLength = 0
  keys = ["title", "permalink", "summary", "content"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"

[taxonomies]
category = "categories"
tag = "tags"
series = "series"
author = "authors"

[[menu.main]]
identifier = "blog"
name = "Blog"
url = "/posts/"
weight = 10

[[menu.main]]
identifier = "projects"
name = "Projects"
url = "/projects/"
weight = 20

[[menu.main]]
identifier = "ideas"
name = "Ideas"
url = "/ideas/"
weight = 30

[[menu.main]]
identifier = "books"
name = "Books"
url = "/books/"
weight = 35

[[menu.main]]
identifier = "about"
name = "About"
url = "/about/"
weight = 40

[[menu.main]]
identifier = "search"
name = "Search"
url = "/search/"
weight = 50

[outputs]
home = ["HTML", "RSS", "JSON"]
section = ["HTML", "RSS"]
taxonomy = ["HTML", "RSS"]
term = ["HTML", "RSS"]

[sitemap]
changefreq = "weekly"
filename = "sitemap.xml"
priority = 0.5

[related]
includeNewer = true
threshold = 80
toLower = true
  [[related.indices]]
  name = "tags"
  weight = 100
  [[related.indices]]
  name = "date"
  weight = 10
